function stepperHtml(current) {
  const steps = [{ n: 1, label: 'Identificación' }, { n: 2, label: 'Predio y cultivo' }, { n: 3, label: 'Documentación' }, { n: 4, label: 'Firma y envío' }];
  let html = '<div class="stepper">';
  steps.forEach((s, i) => {
    const cls = current === s.n ? 'active' : (current > s.n ? 'done' : '');
    html += `<div class="step ${cls}"><div class="step-num">${current > s.n ? '✓' : s.n}</div><div class="step-label">${s.label}</div></div>`;
    if (i < steps.length - 1) html += `<div class="step-line ${current > s.n ? 'done' : ''}"></div>`;
  });
  return html + '</div>';
}
